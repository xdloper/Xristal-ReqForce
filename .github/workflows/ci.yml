name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck & Build Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build browser folders (dist/chrome, dist/edge, dist/firefox)
        run: npm run build

      - name: Verify dist directory structure
        run: |
          for target in chrome edge firefox; do
            test -f "dist/${target}/manifest.json"
            test -f "dist/${target}/index.html"
            test -f "dist/${target}/scripts/background.js"
            test -f "dist/${target}/scripts/content.js"
            test -f "dist/${target}/scripts/injected.js"
            test -f "dist/${target}/scripts/popup.js"
            test -f "dist/${target}/styles/popup.css"
          done

      - name: Upload Chrome artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-chrome
          path: dist/chrome/
          retention-days: 14

      - name: Upload Edge artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-edge
          path: dist/edge/
          retention-days: 14

      - name: Upload Firefox artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-firefox
          path: dist/firefox/
          retention-days: 14
