name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Package & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Package Chrome / Edge & Firefox archives
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd dist

          # Universal / Firefox bundle
          zip -r "../http-interceptor-v${VERSION}-firefox.zip" .

          # Chrome / Edge bundle (strip Firefox-only background.scripts warning)
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
            delete m.background.scripts;
            delete m.browser_specific_settings;
            fs.writeFileSync("manifest.json", JSON.stringify(m, null, 2));
          '
          zip -r "../http-interceptor-v${VERSION}-chromium.zip" .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            http-interceptor-*-chromium.zip
            http-interceptor-*-firefox.zip
