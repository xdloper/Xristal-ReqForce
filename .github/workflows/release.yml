name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Browser Packages
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & Build (dist/chrome, dist/edge, dist/firefox)
        run: npm run build

      - name: Package browser archives inside dist/releases/
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist/releases
          (cd dist/chrome && zip -r "../releases/reqforce-${VERSION}-chrome.zip" .)
          (cd dist/edge && zip -r "../releases/reqforce-${VERSION}-edge.zip" .)
          (cd dist/firefox && zip -r "../releases/reqforce-${VERSION}-firefox.zip" .)

      - name: Upload release archives artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-releases
          path: dist/releases/*.zip
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/releases/reqforce-*-chrome.zip
            dist/releases/reqforce-*-edge.zip
            dist/releases/reqforce-*-firefox.zip
